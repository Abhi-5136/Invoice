<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <!--Font Awesome CDN-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!--navbar section-->
    <header class="app-navbar">
        <div class="brand-title">
            <h1>Tax Invoice Generator</h1>
            <span class="brand-badge"> BAJAJ TEMPLATE</span>
        </div>
        <div class="nav-actions">
            <button id="btn-print">
                🖨️ Print
            </button>
        </div>
    </header>

    <!-- main container: split view-->
    <main class="" app-container>
        <!-- left pane : input control-->
        <section class="form-pane">
            <!-- section 1 customer detail-->
            <div class="form-section">
                <div class="form-section-title">
                    <span>👤 Customer Details </span>
                </div>
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" data-bind="customerName" placeholder="Srinivasa Ramanujan">
                </div>
                <div class="form-group">
                    <label>S/O | D/O | W/O</label>
                    <input type="text" data-bind="soDoWo" placeholder="Kuppuswamy Srinivasa ">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" data-bind="dob">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" data-bind="phone" placeholder="7753814888">
                    </div>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" data-bind="address" placeholder="Kanchipuram, Chennai">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" data-bind="state" placeholder="Tamil Nadu">
                    </div>
                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" data-bind="pincode" placeholder="221101">
                    </div>
                </div>
            </div>

            <!--section2 invoice & vehicle details-->
            <div class="form-section">
                <div class="form-section-title">
                    <span>📄 Invoice & Vehicle Details</span>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Invoice No.</label>
                        <input type="text" data-bind="invoiceNo" placeholder="34">
                    </div>
                    <div class="form-group">
                        <label>Invoice Date</label>
                        <input type="date" data-bind="invoiceDate">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Tax Payable on Reverse Charge</label>
                        <select data-bind="whetherTax">
                            <option value="NO">NO</option>
                            <option value="YES">YES</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>HPA (Hypothecation)</label>
                        <input type="text" data-bind="hpa" placeholder="CASH">
                    </div>
                </div>
                <div class="form-group">
                    <label>Chassis No.</label>
                    <input type="text" data-bind="chassisNo" placeholder="MD2B68BX7TPA40682">
                </div>
                <div class="form-group">
                    <label>Engine No.</label>
                    <input type="text" data-bind="engineNo" placeholder="DHXPTA81581">
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="text" data-bind="color" placeholder="EBONY BLK RACING RED">
                </div>
            </div>

            <!-- Section 3: Table Items Manager -->
            <div class="form-section">
                <div class="form-section-title">
                    <span>🏍️ Invoice Items / Vehicles</span>
                    <button id="btn-add-item" class="btn btn-primary btn-sm">+ Add Item</button>
                </div>
                <div id="items-form-container">
                    <!-- Dynamic Item Cards injected by JS -->
                </div>
            </div>
        </section>

        <!-- right preview -->
         <section class="preview-pane">
            <div class="preview-toolbar">
                <span class="preview-title">👁️ Live preview </span>
                <span style="font-size: 0.75rem; color: #94a3b8;">Real-time update on type</span>
            </div>

            <!--Invoice template-->
            <div id="invoice-template">

                <!--header-->
               






                
            </div>
         </section>
    </main>
</body>

</html>
